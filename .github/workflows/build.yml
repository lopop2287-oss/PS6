name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - run: |
          unzip -o yltus.zip
          cd PS6
          printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\n' | cat - settings.gradle.kts > s.tmp && mv s.tmp settings.gradle.kts
          gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PS6-Launcher-Debug
          path: PS6/app/build/outputs/apk/debug/*.apk
